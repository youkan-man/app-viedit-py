name: Ruff autofix

on:
  push:
    branches:
      - feat/component-model-explorer
    paths:
      - ".github/workflows/ruff-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Ruff fixes
        run: |
          python -m pip install ruff==0.14.14
          python -m ruff check . --fix --unsafe-fixes
      - name: Remove one-shot workflow
        run: rm .github/workflows/ruff-autofix.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff fixes"
          git push origin HEAD
