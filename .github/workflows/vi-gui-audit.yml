name: Real VI GUI audit

on:
  push:
    branches:
      - 'audit/real-vi-gui-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORK_ROOT: /tmp/vi-audit-baseline-jobs
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Baseline automated tests
        continue-on-error: true
        run: |
          mkdir -p audit-evidence
          python -m pytest -q --junitxml=audit-evidence/pytest.xml 2>&1 | tee audit-evidence/pytest.log
      - name: Record tested source and dependencies
        run: |
          git rev-parse HEAD > audit-evidence/tested-commit.txt
          git diff b4746c7ba4c5d4a162caa722fe54746c1869cebc -- app main.py requirements.txt > audit-evidence/application-diff.txt
          git archive --format=tar.gz -o audit-evidence/tested-source.tar.gz HEAD
          python -m pip freeze > audit-evidence/dependencies.txt
      - name: Actual VI import and Chromium screenshots
        run: python scripts/audit_real_vi.py
      - name: Save screenshot and parser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-vi-gui-audit
          path: audit-evidence/
          if-no-files-found: error
          retention-days: 14
