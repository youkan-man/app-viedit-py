name: README edit scope

on:
  push:
    branches:
      - feat/component-model-explorer
    paths:
      - ".github/workflows/readme-edit-scope.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align README with safe edit policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '''編集可能な例:

          - 名称、ラベル、説明
          - 数値、真偽値、文字列
          - 色などの数値プロパティ
          - 矩形
          - 点
          - 座標タプル

          読み取り専用の例:

          - class
          - UID
          - XML構造識別子
          - 参照先ID
          - ファイル参照
          - バイナリ値
          - 子要素を含む混合値
          '''
          new = '''編集可能な例:

          - 名称、ラベル、説明などのテキスト
          - 色、フォント、表示状態などの外観プロパティ
          - `value`、`default`、`min`、`max`、`step`などのデータ値
          - 矩形と点

          読み取り専用の例:

          - classとUID
          - XML構造識別子
          - 参照先IDとファイル参照
          - type、index、count、nInputs、nOutputs、flags、version、offsetなどの構造値
          - バイナリ値
          - 子要素を含む混合値
          - 安全な編集カテゴリーへ分類できないスカラー値
          '''
          if old not in text:
              raise SystemExit('README edit-scope block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/readme-edit-scope.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: clarify safe component edit scope"
          git push origin HEAD
