[project]
name = "pylabview-vi-xml-web"
version = "1.1.0"
description = "Docker-hosted UI for pylabview VI/RSRC conversion, component analysis, property editing and reconstruction"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI intentionally declares File/Form dependencies in endpoint defaults.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Third-party parsed type objects may expose descriptor methods that reject
# partially decoded payloads. Keeping the display string optional is intentional.
"app/lvkit_semantic.py" = ["SIM105"]
# Inherited compatibility shim: dynamic module attributes and optional parser
# hooks are intentional. The two unused names are existing cleanup debt in the
# deep-audit base branch and are isolated here so Issue #13 can be measured.
"app/deep_audit_runtime_patch.py" = ["B010", "F401", "F841", "SIM105", "UP035"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["data"]
