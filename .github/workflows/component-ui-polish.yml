name: Component UI polish

on:
  push:
    branches:
      - feat/component-model-explorer
    paths:
      - ".github/workflows/component-ui-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace inline styles and add component controls CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('app/static/components.js')
          js = js_path.read_text(encoding='utf-8')
          old = """        const primary = textNode('span', 'component-primary', component.name || component.tag || 'unnamed');
                  primary.style.paddingLeft = `${indent * 6}px`;
          """
          new = """        const primary = textNode('span', 'component-primary', component.name || component.tag || 'unnamed');
                  primary.classList.add(`component-depth-${indent}`);
          """
          if old not in js:
              raise SystemExit('expected components.js block not found')
          js_path.write_text(js.replace(old, new), encoding='utf-8')

          css_path = Path('app/static/components.css')
          css = css_path.read_text(encoding='utf-8')
          addition = r'''

          .component-depth-1 { padding-left: 6px; }
          .component-depth-2 { padding-left: 12px; }
          .component-depth-3 { padding-left: 18px; }
          .component-depth-4 { padding-left: 24px; }
          .component-depth-5 { padding-left: 30px; }
          .component-depth-6 { padding-left: 36px; }
          .component-depth-7 { padding-left: 42px; }
          .component-depth-8 { padding-left: 48px; }

          .component-class-inventory {
            display: flex;
            align-items: center;
            min-height: 38px;
            padding: 5px 10px;
            gap: 5px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            white-space: nowrap;
          }

          .component-class-inventory > strong {
            margin-right: 3px;
            color: var(--muted);
            font-size: 9px;
            text-transform: uppercase;
          }

          .component-class-chip {
            min-height: 24px;
            padding: 0 7px;
            border: 1px solid var(--azure-blue-border);
            border-radius: var(--radius);
            color: var(--azure-blue-pressed);
            background: var(--azure-blue-soft);
            font: 9px/1 var(--mono);
            cursor: pointer;
          }

          .component-class-chip:hover {
            border-color: var(--azure-blue);
            background: #deecf9;
          }

          .component-class-more {
            color: var(--muted);
            font: 9px/1 var(--mono);
          }

          .component-inline-coordinate {
            display: grid;
            grid-template-columns: 14px minmax(0, 1fr) 14px minmax(0, 1fr);
            align-items: center;
            gap: 4px;
            color: var(--muted);
            font-size: 8px;
          }

          .component-inline-coordinate input {
            min-width: 0;
            height: 29px;
          }
          '''
          if '.component-depth-1' not in css:
              css_path.write_text(css + addition, encoding='utf-8')
          PY
          rm .github/workflows/component-ui-polish.yml
      - name: Validate and commit
        run: |
          node --check app/static/components.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: remove inline component styles"
          git push origin HEAD
