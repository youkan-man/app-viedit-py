name: Apply verified VI layout editor

on:
  push:
    branches:
      - feat/azure-vi-layout-quantization

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/payload_* | base64 --decode > /tmp/viedit-layout-editor.tar.gz
          echo "ac8c6d02c8dc9a1521a6f6394b6eec0b0dd2cfbeaf810c3128cfe4cb82dafab8  /tmp/viedit-layout-editor.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/viedit-layout-editor.tar.gz
          rm -rf .patch
          rm -f .github/workflows/apply-verified-layout-editor.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q app main.py
          node --check app/static/app.js
          node --check app/static/workspace.js
          node --check app/static/diagram-core.js
          node --check app/static/diagram.js
          node --test tests/js/diagram-core.test.cjs
          if grep -RinE 'AzureGridView|azuregridview|diagram-auto-layout|browser-local|構造マップ|メタデータを自動|structureWires|autoLayoutMetadata|is-metadata' app docs README.md; then
            echo 'A removed layout concept is still present.' >&2
            exit 1
          fi

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: add Azure-styled VI layout quantization editor"
          git push origin "HEAD:${GITHUB_REF_NAME}"
