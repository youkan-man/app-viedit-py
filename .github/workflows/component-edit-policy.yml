name: Component edit policy

on:
  push:
    branches:
      - feat/component-model-explorer
    paths:
      - ".github/workflows/component-edit-policy.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make structured editing conservative
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/component_model.py')
          text = path.read_text(encoding='utf-8')
          marker = '''STRUCTURAL_NAMES = {
              "slclass", "sluid", "slstockobj", "slelements", "slindex", "slstocksource",
              "formatversion", "type", "typehex", "encoding", "file", "format", "index",
          }
          '''
          addition = marker + '''EDIT_TEXT_TOKENS = (
              "name", "label", "description", "caption", "text", "tip", "help",
              "scriptname", "vblname",
          )
          EDIT_APPEARANCE_TOKENS = (
              "color", "font", "visible", "hidden", "disabled", "bold", "italic",
              "justify", "alignment", "opacity", "pattern",
          )
          EDIT_DATA_TOKENS = (
              "value", "default", "minimum", "maximum", "min", "max", "step",
              "increment", "precision", "digits",
          )
          UNSAFE_STRUCTURE_TOKENS = (
              "class", "uid", "reference", "ref", "owner", "parent", "type", "index",
              "count", "number", "ninputs", "noutputs", "flags", "version", "offset",
              "length", "elements", "file", "format", "stock", "source",
          )
          '''
          if marker not in text:
              raise SystemExit('STRUCTURAL_NAMES marker missing')
          text = text.replace(marker, addition, 1)

          old = '''        structural = normalized.lstrip("@").replace("_", "") in STRUCTURAL_NAMES
                  reference_like = value_type == "reference" or normalized_name(tag) in SYSTEM_REFERENCE_TAGS
                  binary = value_type == "binary"
                  editable = (
                      value_type in {"rect", "point", "tuple", "bool", "int", "float", "string"}
                      and not structural and not reference_like and not binary and not has_children
                  )
          '''
          new = '''        normalized_key = normalized.lstrip("@").replace("_", "")
                  base_key = base.lstrip("@").replace("_", "")
                  structural = (
                      normalized_key in STRUCTURAL_NAMES
                      or base_key in STRUCTURAL_NAMES
                      or any(token in base_key for token in UNSAFE_STRUCTURE_TOKENS)
                  )
                  reference_like = value_type == "reference" or normalized_name(tag) in SYSTEM_REFERENCE_TAGS
                  binary = value_type == "binary"
                  if structural:
                      edit_level = "read_only_structure"
                  elif reference_like:
                      edit_level = "read_only_reference"
                  elif binary or has_children:
                      edit_level = "read_only_complex"
                  elif value_type in {"rect", "point"}:
                      edit_level = "safe"
                  elif value_type == "string" and any(
                      token in base_key for token in EDIT_TEXT_TOKENS
                  ):
                      edit_level = "safe"
                  elif value_type in {"int", "float", "bool"} and any(
                      token in base_key
                      for token in (*EDIT_APPEARANCE_TOKENS, *EDIT_DATA_TOKENS)
                  ):
                      edit_level = "safe"
                  else:
                      edit_level = "read_only_unclassified"
                  editable = edit_level == "safe"
          '''
          if old not in text:
              raise SystemExit('editable block missing')
          text = text.replace(old, new, 1)
          old_return = '''            "editable": editable,
                      "structural": structural,
          '''
          new_return = '''            "editable": editable,
                      "edit_level": edit_level,
                      "structural": structural,
          '''
          if old_return not in text:
              raise SystemExit('property return block missing')
          text = text.replace(old_return, new_return, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_components.py')
          test_text = tests.read_text(encoding='utf-8')
          old_test = '''    assert properties["OF__fgColor"]["editable"] is True
              reference = next(prop for prop in detail["properties"] if prop["reference_like"])
          '''
          new_test = '''    assert properties["OF__fgColor"]["editable"] is True
              assert properties["OF__description"]["editable"] is True
              assert properties["@SL__class"]["edit_level"] == "read_only_structure"
              reference = next(prop for prop in detail["properties"] if prop["reference_like"])
          '''
          if old_test not in test_text:
              raise SystemExit('component property test block missing')
          tests.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY
          rm .github/workflows/component-edit-policy.yml
      - name: Validate and commit
        run: |
          python -m pip install ruff==0.14.14
          python -m ruff check app/component_model.py tests/test_components.py --fix
          python -m compileall -q app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restrict component editing to safe fields"
          git push origin HEAD
