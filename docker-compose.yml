services:
  viedit:
    build:
      context: .
    container_name: app-viedit-py
    restart: unless-stopped
    ports:
      - "${VIEDIT_PORT:-8080}:8000"
    environment:
      VIEDIT_DATA_DIR: /data/jobs
      VIEDIT_DEFAULT_TEXT_ENCODING: ${VIEDIT_DEFAULT_TEXT_ENCODING:-shift_jis}
      VIEDIT_MAX_UPLOAD_BYTES: ${VIEDIT_MAX_UPLOAD_BYTES:-134217728}
      VIEDIT_MAX_XML_EDITOR_BYTES: ${VIEDIT_MAX_XML_EDITOR_BYTES:-8388608}
      VIEDIT_COMMAND_TIMEOUT_SECONDS: ${VIEDIT_COMMAND_TIMEOUT_SECONDS:-180}
      VIEDIT_JOB_TTL_SECONDS: ${VIEDIT_JOB_TTL_SECONDS:-86400}
    volumes:
      - viedit-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g

volumes:
  viedit-data:
