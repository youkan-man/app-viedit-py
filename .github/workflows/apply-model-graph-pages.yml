name: Apply model graph pages

on:
  push:
    branches:
      - feat/model-graph-pages
    paths:
      - .patch/model-graph-pages.tar.gz
      - .github/workflows/apply-model-graph-pages.yml

permissions:
  contents: write

concurrency:
  group: apply-model-graph-pages
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      WORK_ROOT: /tmp/app-viedit-jobs
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply generated source bundle
        shell: bash
        run: |
          set -euo pipefail
          cp .patch/model-graph-pages.tar.gz /tmp/model-graph-pages.tar.gz
          echo "1019edfef2d40b0e5bad612ffe5d187d8459a9b4402f57a6c1d5bedf70c85d80  /tmp/model-graph-pages.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/model-graph-pages.tar.gz
          rm -rf .patch
          rm -f .github/workflows/apply-model-graph-pages.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check .
          python -m compileall -q app main.py
          node --check app/static/app.js
          node --check app/static/pages.js
          node --check app/static/graph.js
          node --check app/static/workspace.js
          node --check app/static/quantizer.js
          node --check app/static/components.js
          docker build -t app-viedit-py:model-graph .

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: split workbench into pages and add unified model graph"
          git push origin HEAD:feat/model-graph-pages
