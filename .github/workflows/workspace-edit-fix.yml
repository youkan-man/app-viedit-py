name: Workspace edit flow fix

on:
  push:
    branches:
      - feat/component-model-explorer
    paths:
      - ".github/workflows/workspace-edit-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch workspace edit lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/static/workspace.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("'use strict';\n\nconst componentExplorerReady", "'use strict';\n\nlet mainXmlDirty = false;\n\nconst componentExplorerReady"),
              ("    state.xmlLoadedForJob = null;\n    return;", "    state.xmlLoadedForJob = null;\n    mainXmlDirty = false;\n    return;"),
              ("    state.xmlLoadedForJob = job.job_id;\n  } catch", "    state.xmlLoadedForJob = job.job_id;\n    mainXmlDirty = false;\n  } catch"),
              ("    state.xmlLoadedForJob = null;\n    showToast(`XML読込失敗", "    state.xmlLoadedForJob = null;\n    mainXmlDirty = false;\n    showToast(`XML読込失敗"),
              ("  const explorer = await componentExplorer();\n  await explorer?.setJob(job);", "  const explorer = await componentExplorer();\n  void explorer?.setJob(job);"),
              ("    $('#editor-state').className = 'state-badge is-ready';\n    globalThis.viXmlQuantizer", "    $('#editor-state').className = 'state-badge is-ready';\n    mainXmlDirty = false;\n    globalThis.viXmlQuantizer"),
              ("  try {\n    const updated = await apiRequest(job.rebuild_url, {", "  try {\n    let activeJob = job;\n    if (mainXmlDirty) {\n      const saved = await saveXml();\n      if (!saved) return;\n      activeJob = state.currentJob;\n    }\n    const updated = await apiRequest(activeJob.rebuild_url, {"),
              ("        text_encoding: job.text_encoding || 'shift_jis',", "        text_encoding: activeJob.text_encoding || 'shift_jis',"),
              ("    $('#editor-state').className = 'state-badge is-dirty';\n    const explorer", "    $('#editor-state').className = 'state-badge is-dirty';\n    mainXmlDirty = true;\n    const explorer"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected workspace block missing: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/workspace-edit-fix.yml
      - name: Validate and commit
        run: |
          node --check app/static/workspace.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: save dirty XML before reconstruction"
          git push origin HEAD
