<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">VI/XML Workbench Azure-style interface</title>
  <desc id="desc">Azure Portal inspired light interface for VI extraction, XML editing, coordinate quantization, and reconstruction.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f3f2f1"/>
  <rect width="1200" height="48" fill="#1b1a19"/>
  <rect x="20" y="9" width="30" height="30" rx="2" fill="#0078d4"/>
  <text x="27" y="29" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">VI</text>
  <text x="62" y="22" fill="#fff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">VI/XML Workbench</text>
  <text x="62" y="37" fill="#c8c6c4" font-family="Segoe UI, sans-serif" font-size="9">pylabview control plane</text>
  <text x="480" y="29" fill="#c8c6c4" font-family="Segoe UI, sans-serif" font-size="11">LabVIEW RSRC  /  </text>
  <text x="574" y="29" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Convert &amp; Quantize</text>
  <circle cx="1075" cy="24" r="4" fill="#6bb700"/>
  <text x="1087" y="29" fill="#f3f2f1" font-family="Segoe UI, sans-serif" font-size="10">engine ready</text>

  <text x="28" y="88" fill="#0078d4" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600" letter-spacing="1">LABVIEW RSRC TOOLING</text>
  <text x="28" y="119" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">VI / XML Workbench</text>
  <text x="28" y="143" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="11">VI・CTL・LLBをXMLへ展開し、実データの座標を揃えて再構成します。</text>
  <line x1="28" y1="161" x2="1172" y2="161" stroke="#c8c6c4"/>

  <rect x="28" y="178" width="1144" height="48" fill="#fff4ce"/>
  <rect x="28" y="178" width="3" height="48" fill="#986f0b"/>
  <circle cx="49" cy="202" r="9" fill="none" stroke="#986f0b"/>
  <text x="47" y="206" fill="#986f0b" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">!</text>
  <text x="66" y="198" fill="#5c4405" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">XML単体では再構成できないVIがあります。</text>
  <text x="66" y="214" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="9">補助XML/BINを含むデータセットZIPで保持します。</text>

  <g filter="url(#shadow)">
    <rect x="28" y="244" width="1144" height="192" rx="2" fill="#fff" stroke="#edebe9"/>
  </g>
  <text x="48" y="270" fill="#0078d4" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">CONVERSION</text>
  <text x="48" y="292" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">変換ジョブを作成</text>
  <line x1="28" y1="310" x2="1172" y2="310" stroke="#edebe9"/>
  <text x="50" y="339" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">01  VI → XML</text>
  <text x="226" y="339" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="11">02  XML → VI</text>
  <line x1="48" y1="351" x2="151" y2="351" stroke="#0078d4" stroke-width="2"/>
  <rect x="48" y="370" width="716" height="44" rx="2" fill="#faf9f8" stroke="#8a8886" stroke-dasharray="5 4"/>
  <text x="72" y="397" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="11">VI / RSRCをドロップ、またはクリックして選択</text>
  <rect x="786" y="370" width="168" height="32" rx="2" fill="#fff" stroke="#c8c6c4"/>
  <text x="800" y="391" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="10">shift_jis</text>
  <rect x="974" y="370" width="174" height="32" rx="2" fill="#0078d4"/>
  <text x="1002" y="391" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">XMLへ変換</text>

  <g filter="url(#shadow)">
    <rect x="28" y="454" width="560" height="238" rx="2" fill="#fff" stroke="#edebe9"/>
    <rect x="604" y="454" width="568" height="238" rx="2" fill="#fff" stroke="#edebe9"/>
  </g>
  <rect x="28" y="454" width="3" height="54" fill="#0078d4"/>
  <text x="48" y="476" fill="#0078d4" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">MAIN XML</text>
  <text x="48" y="497" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">XMLエディター</text>
  <rect x="48" y="519" width="520" height="120" rx="2" fill="#faf9f8" stroke="#c8c6c4"/>
  <text x="62" y="542" fill="#605e5c" font-family="Cascadia Mono, monospace" font-size="9">&lt;RSRC&gt;</text>
  <text x="76" y="562" fill="#0078d4" font-family="Cascadia Mono, monospace" font-size="9">&lt;bounds&gt;(3, 5, 103, 55)&lt;/bounds&gt;</text>
  <text x="76" y="582" fill="#0078d4" font-family="Cascadia Mono, monospace" font-size="9">&lt;termHotPoint&gt;(7, 11)&lt;/termHotPoint&gt;</text>
  <text x="62" y="602" fill="#605e5c" font-family="Cascadia Mono, monospace" font-size="9">&lt;/RSRC&gt;</text>
  <rect x="48" y="651" width="96" height="26" rx="2" fill="#fff" stroke="#c8c6c4"/>
  <text x="67" y="668" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="9">XMLを保存</text>

  <rect x="604" y="454" width="3" height="54" fill="#0078d4"/>
  <text x="624" y="476" fill="#0078d4" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">XML COORDINATE TOOL</text>
  <text x="624" y="497" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">配置座標を指定粒度へクオンタイズ</text>
  <text x="624" y="523" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="9">実際に再構成へ使うXMLのコンポーネント・端子・配線座標を丸めます。</text>
  <text x="624" y="552" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">粒度</text>
  <rect x="624" y="560" width="90" height="30" rx="2" fill="#fff" stroke="#c8c6c4"/>
  <text x="638" y="579" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="10">8 px</text>
  <text x="732" y="552" fill="#605e5c" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">丸め</text>
  <rect x="732" y="560" width="130" height="30" rx="2" fill="#fff" stroke="#c8c6c4"/>
  <text x="746" y="579" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="10">最近傍</text>
  <rect x="884" y="560" width="12" height="12" fill="#0078d4"/>
  <text x="904" y="570" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="9">component</text>
  <rect x="884" y="578" width="12" height="12" fill="#0078d4"/>
  <text x="904" y="588" fill="#201f1e" font-family="Segoe UI, sans-serif" font-size="9">connector / wire</text>
  <rect x="624" y="606" width="112" height="30" rx="2" fill="#fff" stroke="#0078d4"/>
  <text x="646" y="625" fill="#005a9e" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">差分を解析</text>
  <rect x="748" y="606" width="112" height="30" rx="2" fill="#0078d4"/>
  <text x="772" y="625" fill="#fff" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">XMLへ反映</text>
  <rect x="884" y="606" width="264" height="54" rx="2" fill="#eff6fc" stroke="#c7e0f4"/>
  <text x="900" y="625" fill="#005a9e" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">3 elements / 7 coordinates</text>
  <text x="900" y="645" fill="#605e5c" font-family="Cascadia Mono, monospace" font-size="8">(3,5,103,55) → (0,8,100,58)</text>
</svg>
