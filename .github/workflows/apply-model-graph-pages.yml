name: Apply model graph pages

on:
  push:
    branches:
      - feat/model-graph-pages
    paths:
      - .patch/model-graph-pages.b64.*
      - .github/workflows/apply-model-graph-pages.yml

permissions:
  contents: write

concurrency:
  group: apply-model-graph-pages
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      WORK_ROOT: /tmp/app-viedit-jobs
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply generated source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/model-graph-pages.b64.* > /tmp/model-graph-pages.b64
          echo "72eb5741ca10fd70fb43e1b6703139171e1f16a73978cf9a84c5d47ac0d68971  /tmp/model-graph-pages.b64" | sha256sum --check --strict
          base64 --decode /tmp/model-graph-pages.b64 > /tmp/model-graph-pages.tar.gz
          echo "1019edfef2d40b0e5bad612ffe5d187d8459a9b4402f57a6c1d5bedf70c85d80  /tmp/model-graph-pages.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/model-graph-pages.tar.gz

          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = readme_text.replace("## 画面構成", "## 基本操作", 1)
          readme_text = readme_text.replace(
              "## モデルグラフの解析範囲",
              "## VI構造・コンポーネント",
              1,
          )
          readme_text = readme_text.replace(
              "## 制約",
              "## 対応範囲と制約",
              1,
          )
          readme.write_text(readme_text, encoding="utf-8")

          test_path = Path("tests/test_model_graph.py")
          test_text = test_path.read_text(encoding="utf-8")
          old = '    assert (by_uid["10"]["id"], by_uid["100"]["id"], "connection") in resolved_pairs\n'
          new = '''    assert any(\n        edge["type"] == "connection"\n        and edge["resolved"]\n        and {edge["source"], edge["target"]}\n        == {by_uid["10"]["id"], by_uid["100"]["id"]}\n        for edge in graph["connections"]\n    )\n'''
          if old not in test_text:
              raise SystemExit("expected directed connection assertion was not found")
          test_path.write_text(test_text.replace(old, new, 1), encoding="utf-8")

          graph_path = Path("app/model_graph.py")
          graph_text = graph_path.read_text(encoding="utf-8")
          token_marker = '''def _numeric_tokens(value: str) -> list[str]:\n    return [match.group(0) for match in NUMBER_RE.finditer(value)]\n\n\n'''
          field_helper = '''def _numeric_tokens(value: str) -> list[str]:\n    return [match.group(0) for match in NUMBER_RE.finditer(value)]\n\n\ndef _field_key(value: object) -> str:\n    raw = str(value or "").rsplit("}", 1)[-1].rsplit(":", 1)[-1]\n    lowered = raw.lower()\n    for prefix in ("of__", "sl__"):\n        if lowered.startswith(prefix):\n            lowered = lowered[len(prefix) :]\n            break\n    return lowered.replace("_", "")\n\n\n'''
          if token_marker not in graph_text:
              raise SystemExit("numeric token marker was not found")
          graph_text = graph_text.replace(token_marker, field_helper, 1)
          graph_text = graph_text.replace(
              'str(prop.get("field_name") or "").replace("_", "").lower()',
              '_field_key(prop.get("field_name"))',
          )
          graph_text = graph_text.replace(
              'normalized = field.replace("_", "").lower()',
              'normalized = _field_key(field)',
          )
          nested_connection = '''    if any(\n        token in normalized\n        for token in ("wire", "signal", "tunnel", "terminal", "connector")\n    ):\n        if normalized.endswith(("id", "list", "node", "dco")):\n            return "connection"\n'''
          combined_connection = '''    if any(\n        token in normalized\n        for token in ("wire", "signal", "tunnel", "terminal", "connector")\n    ) and normalized.endswith(("id", "list", "node", "dco")):\n        return "connection"\n'''
          if nested_connection not in graph_text:
              nested_connection = '''    if any(token in normalized for token in ("wire", "signal", "tunnel", "terminal", "connector")):\n        if normalized.endswith(("id", "list", "node", "dco")):\n            return "connection"\n'''
              combined_connection = '''    if any(\n        token in normalized\n        for token in ("wire", "signal", "tunnel", "terminal", "connector")\n    ) and normalized.endswith(("id", "list", "node", "dco")):\n        return "connection"\n'''
          if nested_connection not in graph_text:
              raise SystemExit("nested connection classification was not found")
          graph_path.write_text(
              graph_text.replace(nested_connection, combined_connection, 1),
              encoding="utf-8",
          )

          component_path = Path("app/component_model.py")
          component_text = component_path.read_text(encoding="utf-8")
          component_marker = '''    if role == "file":\n        return "file"\n    haystack = " ".join(\n'''
          component_replacement = '''    if role == "file":\n        return "file"\n    class_key = normalized_name(class_name)\n    if class_key in {\n        "term",\n        "fpterm",\n        "terminal",\n        "connector",\n        "tunnel",\n        "port",\n        "conpaneconnection",\n        "growterminfo",\n    }:\n        return "connector"\n    if class_key in {"wire", "signal", "hsignal", "fboxline"}:\n        return "wire"\n    haystack = " ".join(\n'''
          if component_marker not in component_text:
              raise SystemExit("component classification marker was not found")
          component_path.write_text(
              component_text.replace(
                  component_marker,
                  component_replacement,
                  1,
              ),
              encoding="utf-8",
          )
          PY

          # The GitHub Actions token may update repository contents but cannot
          # modify workflow files. Keep the branch's existing CI definition in
          # this source-only commit; it is updated separately after validation.
          git checkout HEAD -- .github/workflows/ci.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Normalize generated Python formatting
        run: python -m ruff check --fix-only app/model_graph.py tests/test_pages.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check .
          python -m compileall -q app main.py
          node --check app/static/app.js
          node --check app/static/pages.js
          node --check app/static/graph.js
          node --check app/static/workspace.js
          node --check app/static/quantizer.js
          node --check app/static/components.js
          docker build -t app-viedit-py:model-graph .

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Makefile app tests
          git diff --cached --stat
          git commit -m "feat: split workbench into pages and add unified model graph"
          git push origin HEAD:feat/model-graph-pages
